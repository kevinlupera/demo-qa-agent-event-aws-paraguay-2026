  #   - name: Crear sandbox (EC2)
  #     run: |
  #       ID=$(aws ec2 run-instances --image-id "$AMI" --instance-type t3.small \
  #              --tag-specifications "ResourceType=instance,Tags=[{Key=eval-pr,Value=${{ github.event.number }}}]" \
  #              --query 'Instances[0].InstanceId' --output text)
  #       aws ec2 wait instance-running --instance-ids "$ID"
  #       echo "EC2_ID=$ID" >> "$GITHUB_ENV"
  #
  #   - name: Destruir sandbox (EC2)
  #     if: always()
  #     run: aws ec2 terminate-instances --instance-ids "$EC2_ID"
  #
  # Programa además una limpieza de las instancias con la etiqueta eval-pr que superen unas
  # horas: es la red de seguridad si el runner muere antes del paso `always()`.
